name: valeosense
x-queryflux-runtime: &queryflux-runtime
  image: valeosense-queryflux-dual
  build:
    context: ..
    dockerfile: infra/queryflux.Dockerfile
x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  env_file: ../.env
  environment: &app-env
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    CLICKHOUSE_URL: http://clickhouse:8123
    DATABASE_URL: postgresql://${POSTGRES_USER:-valeosense}:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/${POSTGRES_DB:-valeosense}
    QUERYFLUX_URL: ${QUERYFLUX_COMPOSE_URL:-http://queryflux:18080}
    ANALYTICS_ROUTE: ${ANALYTICS_ROUTE:-direct}
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    command: [redpanda, start, --smp, '1', --memory, 512M, --reserve-memory, 0M, --overprovisioned, --node-id, '0', --check=false, --kafka-addr, 'internal://0.0.0.0:9092,external://0.0.0.0:19092', --advertise-kafka-addr, 'internal://redpanda:9092,external://localhost:19092']
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: [CMD, rpk, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valeosense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
      POSTGRES_DB: ${POSTGRES_DB:-valeosense}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30
  duckdb-sync:
    <<: *queryflux-runtime
    entrypoint: [/usr/bin/tini, --, /opt/venv/bin/python, /opt/valeosense/duckdb_snapshot.py]
    command: [sync]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      DUCKDB_WINDOW_MINUTES: ${DUCKDB_WINDOW_MINUTES:-120}
      DUCKDB_VEHICLE_LIMIT: ${DUCKDB_VEHICLE_LIMIT:-100}
      DUCKDB_ROW_LIMIT: ${DUCKDB_ROW_LIMIT:-20000}
      DUCKDB_SYNC_SECONDS: ${DUCKDB_SYNC_SECONDS:-30}
      DUCKDB_MAX_AGE_SECONDS: ${DUCKDB_MAX_AGE_SECONDS:-120}
    volumes: ["duckdb:/data"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /opt/venv/bin/python, /opt/valeosense/duckdb_snapshot.py, health]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    profiles: [queryflux]
  queryflux:
    <<: *queryflux-runtime
    entrypoint: [/usr/bin/tini, --, sh, -c]
    command:
      - >-
        /opt/venv/bin/python /opt/valeosense/queryflux_config.py --compose
        --template /opt/valeosense/queryflux.yaml --output /tmp/queryflux.yaml &&
        /opt/venv/bin/python /opt/valeosense/duckdb_snapshot.py bootstrap &&
        exec /app/queryflux --config /tmp/queryflux.yaml
    environment:
      PYTHONPATH: /opt/venv/lib/python3.12/site-packages
      QUERYFLUX_ADMIN_PASSWORD: ${API_KEY:?Run make setup first}
      API_KEY: ${API_KEY:?Run make setup first}
    volumes: ["duckdb:/data"]
    ports: ["127.0.0.1:18081:18080"]
    depends_on:
      clickhouse: {condition: service_healthy}
      duckdb-sync: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:19000/health]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [queryflux]
  seed:
    <<: *app
    command: [python, -m, scripts.seed_metadata]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redpanda: {condition: service_healthy}
  backend:
    <<: *app
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, '8000']
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  processor:
    <<: *app
    command: [python, -m, processor.consumer]
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: on-failure
  simulator:
    <<: *app
    command: [python, -m, simulator.cli, --vehicles, '100000', --active-vehicles, '1000', --rate, '1000', --duration, '0']
    depends_on:
      seed: {condition: service_completed_successfully}
      processor: {condition: service_started}
    profiles: [demo]
  frontend:
    build: {context: ../frontend}
    ports: ["127.0.0.1:3000:8080"]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: [backend]
  metrics-exporter:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      API_KEY: ${API_KEY:?Run make setup first}
      MONITORING_API_URL: http://backend:8000
    command: [uvicorn, backend.monitoring:app, --host, 0.0.0.0, --port, '9100']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    profiles: [monitoring]
  prometheus:
    image: prom/prometheus:v3.13.3
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=512MB]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      metrics-exporter: {condition: service_healthy}
    profiles: [monitoring]
  grafana:
    image: grafana/grafana:12.4.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${API_KEY:?Run make setup first}}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus: {condition: service_healthy}
    profiles: [monitoring]
volumes:
  duckdb:
  redpanda:
  redis:
  postgres:
  clickhouse:
  prometheus:
  grafana:
