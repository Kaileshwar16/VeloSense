global:
  scrape_interval: 10s
  scrape_timeout: 5s
scrape_configs:
  - job_name: valeosense
    static_configs:
      - targets: ['metrics-exporter:9100']
  # Actual engine execution observations from QueryFlux, independent of API labels.
  - job_name: queryflux
    static_configs:
      - targets: ['queryflux:19000']
