# Schema validated with the digest-pinned image (binary reports 0.0.1; DuckDB 1.5.1).
# Also inspected upstream checkout 5d06d83; its version is not the image revision.
queryflux:
  externalAddress: http://localhost:18080
  frontends:
    trinoHttp:
      enabled: true
      port: 18080
      maxConnections: 16
  persistence:
    type: inMemory
  adminApi:
    port: 19000
clusters:
  valeosense-clickhouse:
    engine: clickHouse
    endpoint: http://localhost:8123
    maxRunningQueries: 4
    maxResultBufferBytes: 16777216
  valeosense-duckdb:
    engine: duckDb
    databasePath: /data/recent.duckdb
    maxRunningQueries: 1
    maxResultBufferBytes: 16777216
clusterGroups:
  analytics:
    members: [valeosense-clickhouse]
    maxRunningQueries: 4
    maxQueuedQueries: 16
    capacityWaitTimeoutSecs: 10
  recent-analytics:
    members: [valeosense-duckdb]
    maxRunningQueries: 1
    maxQueuedQueries: 8
    capacityWaitTimeoutSecs: 5
routers:
  - type: queryRegex
    rules:
      - regex: '(?i)\bFROM\s+valeosense_recent\.telemetry\b'
        targetGroup: recent-analytics
routingFallback: analytics
