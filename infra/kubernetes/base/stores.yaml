apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: service
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgres:17
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        env:
        - name: POSTGRES_USER
          value: valeosense
        - name: POSTGRES_DB
          value: valeosense
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valeosense-secrets
              key: POSTGRES_PASSWORD
        readinessProbe:
          exec: &id001
            command:
            - pg_isready
            - -U
            - valeosense
            - -d
            - valeosense
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: service
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        command:
        - redis-server
        - --appendonly
        - 'yes'
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - noeviction
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redpanda
  ports:
  - name: service
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 250m
            memory: 600Mi
          limits:
            memory: 1536Mi
        command:
        - rpk
        - redpanda
        - start
        - --smp
        - '1'
        - --memory
        - 512M
        - --reserve-memory
        - 0M
        - --overprovisioned
        - --node-id
        - '0'
        - --check=false
        - --kafka-addr
        - 0.0.0.0:9092
        - --advertise-kafka-addr
        - redpanda:9092
        ports:
        - containerPort: 9092
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
        readinessProbe:
          exec: &id001
            command:
            - rpk
            - cluster
            - health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redpanda
      securityContext:
        fsGroup: 101
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
  - name: service
    port: 8123
    targetPort: 8123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.8-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 2Gi
        ports:
        - containerPort: 8123
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: memory-config
          mountPath: /etc/clickhouse-server/config.d/memory.xml
          subPath: memory.xml
          readOnly: true
        env:
        - name: CLICKHOUSE_SKIP_USER_SETUP
          value: '1'
        readinessProbe:
          httpGet: &id001
            path: /ping
            port: 8123
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clickhouse
      - name: memory-config
        configMap:
          name: clickhouse-memory
