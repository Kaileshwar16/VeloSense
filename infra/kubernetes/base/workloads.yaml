apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
  - name: service
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: backend
        image: valeosense-app:cloud
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        command:
        - uvicorn
        - backend.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: valeosense-config
        - secretRef:
            name: valeosense-secrets
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: processor
        image: valeosense-app:cloud
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        command:
        - python
