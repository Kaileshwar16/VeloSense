---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  labels:
    app.kubernetes.io/name: simulator
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulator
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: simulator
        image: valeosense-app:cloud
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
        command:
        - python
        - -m
        - simulator.cli
        - --vehicles
        - '100000'
        - --active-vehicles
        - '50'
        - --rate
        - '10'
        - --duration
        - '0'
        envFrom:
        - configMapRef:
            name: valeosense-config
        - secretRef:
            name: valeosense-secrets
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: service
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: valeosense
    valeosense.io/phase: runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: valeosense
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: frontend
        image: valeosense-frontend:cloud
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: &id001
            path: /
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 60
