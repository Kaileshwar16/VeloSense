[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "valeosense"
version = "0.1.0"
description = "Real-time intelligence for massive connected-vehicle streams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "redis>=5,<9", "confluent-kafka>=2.6,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1", "python-dotenv>=1,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "psutil>=6,<8", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["shared*", "simulator*", "processor*", "backend*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local Compose infrastructure"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
